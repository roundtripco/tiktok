<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسومات راوند تريب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F3EC;color:#1C2C25;font-family:"Tajawal",system-ui,sans-serif;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:#6E7A73;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1100px}
.cover{position:relative;height:170px;border-radius:18px;overflow:hidden}
.cover b{position:absolute;bottom:10px;right:14px;color:#fff;font-size:16px;direction:ltr}
</style>
</head>
<body>
<h1>رسومات أغلفة الأيام</h1>
<p>كل رسمة لها مفتاح تستخدمه في ARTMAP. أضف * بعد المفتاح للألعاب النارية.</p>
<div class="grid" id="g"></div>
<script src="illustrations.js"></script>
<script>
document.head.insertAdjacentHTML("beforeend","<style>"+ART_CSS+"</style>");
const keys=["chateau","chateau*","castle","castle*","eiffel","arc","louvre","sacre","versailles","brussels","canal","windmill","rotterdam","giethoorn","giethoorn*","rijks","plane"];
document.getElementById("g").innerHTML=keys.map(k=>`<div class="cover">${artTag(k)}<b>${k}</b></div>`).join("");
</script>
</body>
</html>
