<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}لوحة التحكم{% endblock %} · {{ service_name }}</title>
<style>
{{ fonts_css | safe }}
:root {
  --bg: #f3f6f4; --surface: #ffffff; --ink: #18211d; --muted: #5d6b65; --line: #dbe3de;
  --accent: #1e6b52; --accent-ink: #ffffff; --accent-soft: #e2efe8;
  --ok: #1e6b52; --ok-soft: #e2efe8; --warn: #9a6a00; --warn-soft: #fbf1d8; --bad: #b3261e; --bad-soft: #fbe5e3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1513; --surface: #17201c; --ink: #e7eeea; --muted: #9aaba3; --line: #29342f;
    --accent: #47ab87; --accent-ink: #0b1310; --accent-soft: #1b2c25;
    --ok: #5cc29b; --ok-soft: #173026; --warn: #e2b34d; --warn-soft: #33290f; --bad: #f08a80; --bad-soft: #3a1c19;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Tajawal', system-ui, sans-serif; font-size: 16px; line-height: 1.6; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.top { background: var(--surface); border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; color: var(--ink); text-decoration: none; }
.brand i { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
.brand svg { width: 20px; height: 20px; fill: var(--accent-ink); }
.top nav { display: flex; gap: 18px; font-weight: 700; font-size: 15px; }
h1 { font-size: 28px; font-weight: 800; margin: 0; line-height: 1.3; }
h2 { font-size: 20px; font-weight: 800; margin: 0 0 14px; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.grid { display: grid; gap: 16px; }
.banner { border-radius: 12px; padding: 12px 16px; font-weight: 700; margin-bottom: 18px; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.err { background: var(--bad-soft); color: var(--bad); }
.pill { display: inline-block; border-radius: 999px; padding: 2px 12px 0; font-size: 13px; font-weight: 800; white-space: nowrap; }
.pill.paid { background: var(--ok-soft); color: var(--ok); }
.pill.trial { background: var(--warn-soft); color: var(--warn); }
.pill.expired { background: var(--bad-soft); color: var(--bad); }
.num { font-variant-numeric: tabular-nums; }
button, .btn {
  font: inherit; font-weight: 800; border-radius: 10px; border: 1.5px solid var(--accent); cursor: pointer;
  padding: 7px 16px 5px; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-block;
}
button.ghost, .btn.ghost { background: transparent; color: var(--accent); }
button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px 6px; width: 100%;
}
textarea { min-height: 90px; resize: vertical; }
label { font-weight: 700; font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: right; font-size: 13px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
code { font-family: ui-monospace, monospace; font-size: 14px; background: var(--bg); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="house" viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></symbol></svg>
{% block body %}{% endblock %}
</body>
</html>
