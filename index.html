<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راوند تريب — محتوى تيك توك</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
  :root {
    --dark: #1a2820; --green: #4A6B5B; --light-green: #6a9b7e;
    --pale: #f0ede8; --warm: #D0CEBB; --white: #ffffff;
    --accent: #c8a96e; --text: #1a2820; --muted: #7a8c84;
    --border: #d8d4cc;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'IBM Plex Sans Arabic',sans-serif; background:var(--pale); color:var(--text); min-height:100vh; }

  .header { background:var(--dark); padding:18px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-mark { width:36px; height:36px; background:var(--green); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:white; }
  .logo-text { color:white; font-size:15px; font-weight:600; }
  .logo-sub { color:#7a8c84; font-size:11px; }
  .month-badge { background:var(--green); color:white; padding:6px 16px; border-radius:20px; font-size:13px; font-weight:500; }

  .stats-bar { background:var(--white); border-bottom:1px solid var(--border); padding:14px 32px; display:flex; gap:32px; }
  .stat-num { font-size:22px; font-weight:700; color:var(--green); line-height:1; }
  .stat-label { font-size:11px; color:var(--muted); }

  .tabs { background:var(--white); border-bottom:1px solid var(--border); padding:0 32px; display:flex; }
  .tab { padding:13px 18px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border:none; border-bottom:2px solid transparent; background:none; font-family:inherit; transition:all .2s; }
  .tab.active { color:var(--green); border-bottom-color:var(--green); }

  .main { padding:28px 32px; max-width:1100px; margin:0 auto; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .section-title { font-size:17px; font-weight:700; }

  .btn-green { background:var(--green); color:white; border:none; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .2s; }
  .btn-green:hover { background:var(--light-green); }
  .btn-green:disabled { opacity:.5; cursor:not-allowed; }

  .notice { background:#fff8ed; border:1px solid var(--accent); border-radius:8px; padding:11px 15px; font-size:12px; color:#7a5a1e; margin-bottom:20px; }

  .week-label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; margin-top:24px; }

  .post-card { background:var(--white); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:10px; display:flex; align-items:center; gap:14px; transition:box-shadow .2s; }
  .post-card:hover { box-shadow:0 4px 14px rgba(0,0,0,.06); }
  .post-card.done { opacity:.6; background:#f0f7f3; border-color:var(--green); }

  .day-badge { background:var(--pale); border:1px solid var(--border); border-radius:8px; padding:6px 10px; text-align:center; min-width:50px; flex-shrink:0; }
  .day-name { font-size:10px; color:var(--muted); }
  .day-num { font-size:17px; font-weight:700; line-height:1.2; }

  .post-info { flex:1; min-width:0; }
  .post-topic { font-size:14px; font-weight:600; margin-bottom:4px; }
  .post-meta { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 9px; border-radius:20px; font-weight:500; }
  .tag-type { background:#e8f0ea; color:var(--green); }
  .tag-dest { background:#f5f0e8; color:#8a6d3b; }

  .post-actions { display:flex; gap:6px; flex-shrink:0; }
  .btn-sm { padding:6px 12px; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; border:none; font-family:inherit; transition:all .15s; }
  .btn-view { background:var(--pale); color:var(--text); border:1px solid var(--border); }
  .btn-view:hover { background:var(--warm); }
  .btn-send { background:var(--dark); color:white; min-width:90px; display:flex; align-items:center; justify-content:center; gap:4px; }
  .btn-send:hover:not(:disabled) { background:var(--green); }
  .btn-send:disabled { opacity:.5; cursor:not-allowed; }
  .btn-check { background:transparent; border:1px solid var(--border); color:var(--muted); width:30px; padding:6px; text-align:center; }
  .btn-check.on { background:var(--green); color:white; border-color:var(--green); }

  /* STATUS INLINE */
  .inline-status { margin-top:8px; font-size:11px; padding:7px 12px; border-radius:6px; display:none; }
  .inline-status.loading { display:block; background:#f0f7f3; color:var(--green); }
  .inline-status.done { display:block; background:#e8f5ee; color:#2d6a4f; border:1px solid #b7dfc8; }
  .inline-status.error { display:block; background:#fff0f0; color:#c0392b; border:1px solid #f5c6c6; }

  /* MODAL */
  .overlay { display:none; position:fixed; inset:0; background:rgba(26,40,32,.6); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  .overlay.open { display:flex; }
  .modal { background:var(--white); border-radius:14px; width:100%; max-width:600px; max-height:88vh; overflow-y:auto; padding:28px; position:relative; }
  .modal-close { position:absolute; top:14px; left:14px; background:var(--pale); border:none; width:30px; height:30px; border-radius:7px; cursor:pointer; font-size:15px; color:var(--muted); }
  .modal-h { font-size:17px; font-weight:700; margin-bottom:4px; padding-left:36px; }
  .modal-sub { font-size:12px; color:var(--muted); margin-bottom:22px; }
  .msec-title { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:7px; margin-top:18px; }
  .mtext { font-size:13px; line-height:1.75; background:var(--pale); padding:12px 14px; border-radius:8px; white-space:pre-wrap; }
  .hashtags { font-size:13px; color:var(--green); line-height:2; background:var(--pale); padding:12px 14px; border-radius:8px; }
  .copy-btn { background:var(--pale); border:1px solid var(--border); border-radius:5px; padding:3px 9px; font-size:11px; cursor:pointer; font-family:inherit; color:var(--muted); margin-top:6px; }
  .copy-btn:hover { background:var(--warm); }

  /* VIDEO PREVIEW */
  .video-preview { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:6px; }
  .video-preview video { width:100%; max-height:200px; object-fit:cover; display:block; }
  .video-preview-info { padding:8px 12px; font-size:12px; color:var(--muted); background:var(--pale); }

  .modal-footer { display:flex; gap:8px; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .btn-modal { flex:1; padding:11px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:inherit; }
  .btn-primary { background:var(--dark); color:white; }
  .btn-primary:hover:not(:disabled) { background:var(--green); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary { background:var(--pale); color:var(--text); border:1px solid var(--border); }

  .descript-result { background:#e8f5ee; border:1px solid #b7dfc8; border-radius:8px; padding:12px 14px; margin-top:12px; font-size:13px; color:#2d6a4f; display:none; }
  .descript-result.show { display:block; }
  .descript-result a { color:var(--green); font-weight:600; }

  .page { display:none; }
  .page.active { display:block; }

  .ideas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .idea-card { background:var(--white); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .idea-icon { font-size:22px; margin-bottom:8px; }
  .idea-title { font-size:14px; font-weight:600; margin-bottom:5px; }
  .idea-desc { font-size:12px; color:var(--muted); line-height:1.6; }

  .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media(max-width:600px) {
    .header,.stats-bar,.tabs,.main { padding-left:14px; padding-right:14px; }
    .stats-bar { gap:18px; flex-wrap:wrap; }
    .post-card { flex-wrap:wrap; }
    .post-actions { width:100%; justify-content:flex-end; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">RT</div>
    <div>
      <div class="logo-text">راوند تريب</div>
      <div class="logo-sub">إدارة محتوى تيك توك</div>
    </div>

</div>

<div class="stats-bar">

  <div class="stat"><div class="stat-num" id="sLeft">20</div><div class="stat-label">متبقي</div></div>
  <div class="stat"><div class="stat-num">5</div><div class="stat-label">بوست / أسبوع</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showPage('schedule',this)">📅 الجدول الشهري</button>
  <button class="tab" onclick="showPage('ideas',this)">💡 مكتبة الأفكار</button>
</div>

<div class="main">
  <div class="page active" id="page-schedule">
    <div class="section-header">
      <div class="section-title">جدول سبتمبر 2025</div>
      <button class="btn-green" onclick="alert('افتح محادثة راوند تريب AI وقول: جدد المحتوى ✅')">🔄 تجديد الشهر</button>
    </div>
    <div class="notice">🔇 كل الفيديوهات: بدون موسيقى، بدون بشر — Descript يعمل Mute تلقائياً للأوديو ويحتفظ بالصوت الطبيعي فقط</div>
    <div id="scheduleEl"></div>
  </div>

  <div class="page" id="page-ideas">
    <div class="section-header"><div class="section-title">مكتبة الأفكار</div></div>
    <div class="ideas-grid" id="ideasEl"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-h" id="mTitle"></div>
    <div class="modal-sub" id="mSub"></div>

    <div class="msec-title">الكابشن</div>
    <div class="mtext" id="mCaption"></div>
    <button class="copy-btn" onclick="cp('mCaption')">نسخ</button>

    <div class="msec-title">الهاشتاقات</div>
    <div class="hashtags" id="mHash"></div>
    <button class="copy-btn" onclick="cp('mHash')">نسخ</button>

    <div class="msec-title">معاينة الفيديو</div>
    <div id="mVideoWrap"></div>

    <div class="descript-result" id="descResult"></div>

    <div class="modal-footer">
      <button class="btn-modal btn-primary" id="btnDesc" onclick="modalSendDescript()">⬇️ تحميل الكل</button>
      <button class="btn-modal btn-secondary" onclick="closeModal()">إغلاق</button>
    </div>
  </div>
</div>

let done = JSON.parse(localStorage.getItem('rt_done') || '[]');

let currentVideoUrl = null;

// ── PEXELS ──────────────────────────────────────────
async function fetchPexelsVideo(query) {
  const url = `http://187.127.84.160:8080/pexels-proxy/videos/search?query=${encodeURIComponent(query)}&per_page=5&orientation=portrait&size=medium`;
  const r = await fetch(url, { headers: { Authorization: PEXELS_KEY } });
  const d = await r.json();
  if (!d.videos || !d.videos.length) throw new Error('لم يتم العثور على فيديو');
  // Pick first video with HD file
  for (const v of d.videos) {
    const hd = v.video_files.find(f => f.quality === 'hd' || f.quality === 'sd');
    if (hd) return { url: hd.link, thumb: v.image, id: v.id };
  }
  throw new Error('لا يوجد ملف مناسب');
}

// ── DESCRIPT ─────────────────────────────────────────
async function sendToDescriptAPI(videoUrl, topic) {
  // We use Claude API to trigger Descript via prompt
  // Since we can't call Descript MCP from JS, we call Claude API with Descript MCP
  const r = await fetch('http://187.127.84.160:8080/descript-proxy/v2/mcp/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      mcp_servers: [{
        type: 'url',
        url: 'https://api.descript.com/v2/mcp/claude',
        name: 'descript'
      }],
      messages: [{
        role: 'user',
        content: `Import this video into Descript and create a new project for TikTok:
- Video URL: ${videoUrl}
- Project name: RT TikTok — ${topic}
- After import, mute all audio tracks completely (music and any background audio)
- Keep only ambient natural sound if possible, or mute everything
- Target format: vertical 9:16 for TikTok, 30-60 seconds
Please import the video and return the project URL.`
      }]
    })
  });
  const data = await r.json();
  // Extract project URL from response
  const text = data.content?.map(c => c.text || '').join('') || '';
  const urlMatch = text.match(/https:\/\/web\.descript\.com\/[^\s"')]+/);
  return { text, url: urlMatch ? urlMatch[0] : null };
}

// ── RENDER SCHEDULE ───────────────────────────────────
function renderSchedule() {
  const weekNames = ['الأسبوع الأول (1–7)', 'الأسبوع الثاني (8–14)', 'الأسبوع الثالث (15–21)', 'الأسبوع الرابع (22–28)'];
  let html = '';
  [1,2,3,4].forEach(w => {
    html += `<div class="week-label">${weekNames[w-1]} سبتمبر</div>`;
    posts.filter(p => p.week === w).forEach(p => {
      const isDone = done.includes(p.id);
      html += `
      <div class="post-card ${isDone ? 'done' : ''}" id="card${p.id}">
        <div class="day-badge"><div class="day-name">${p.day}</div><div class="day-num">${p.date}</div></div>
        <div class="post-info">
          <div class="post-topic">${p.topic}</div>
          <div class="post-meta">
            <span class="tag tag-type">${p.type}</span>
            <span class="tag tag-dest">📍 ${p.dest}</span>
          </div>
          <div class="inline-status" id="st${p.id}"></div>
        </div>
        <div class="post-actions">
          <button class="btn-sm btn-view" onclick="openModal(${p.id})">التفاصيل</button>
          <button class="btn-sm btn-send" id="sb${p.id}" onclick="quickSend(${p.id})">
            🎬 أرسل
          </button>
          <button class="btn-sm btn-check ${isDone ? 'on' : ''}" onclick="toggleDone(${p.id})">✓</button>
        </div>
      </div>`;
    });
  });
  document.getElementById('scheduleEl').innerHTML = html;
  updateStats();
}

// ── QUICK SEND (inline) ───────────────────────────────
async function quickSend(id) {
  const p = posts.find(x => x.id === id);
  const btn = document.getElementById('sb' + id);
  const st = document.getElementById('st' + id);

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  st.className = 'inline-status loading';
  st.textContent = '⏳ جاري جلب الفيديو من Pexels...';

  try {
    // Fetch multiple videos
    const videos = await fetchMultipleVideos(p.pexels);
    for (let i = 0; i < videos.length; i++) {
      await new Promise(r => setTimeout(r, 400 * i));
      const a = document.createElement('a');
      a.href = videos[i].url;
      a.download = `RT_${p.id}_clip${i+1}.mp4`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    st.className = 'inline-status done';
    st.innerHTML = `✅ تم تحميل ${videos.length} مقاطع — أعطها للمصمم`;
  } catch(e) {
    st.className = 'inline-status error';
    st.textContent = '⚠️ ' + (e.message || 'حدث خطأ، حاول مرة ثانية');
  }

  btn.disabled = false;
  btn.innerHTML = '⬇️ تحميل الكل';
}

// ── MODAL ─────────────────────────────────────────────
async function openModal(id) {
  currentPost = posts.find(p => p.id === id);
  currentVideoUrl = null;
  if (!currentPost) return;

  document.getElementById('mTitle').textContent = currentPost.topic;
  document.getElementById('mSub').textContent = `${currentPost.day} ${currentPost.date} سبتمبر — ${currentPost.dest}`;
  document.getElementById('mCaption').textContent = currentPost.caption;
  document.getElementById('mHash').textContent = currentPost.hashtags;
  document.getElementById('descResult').className = 'descript-result';
  document.getElementById('btnDesc').disabled = false;
  document.getElementById('btnDesc').textContent = '⬇️ تحميل الكل';

  // Load video previews
  const wrap = document.getElementById('mVideoWrap');
  wrap.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;">⏳ جاري تحميل المقاطع...</div>';
  document.getElementById('overlay').classList.add('open');

  try {
    const videos = await fetchMultipleVideos(currentPost.pexels);
    currentVideoUrl = videos[0].url;
    currentVideos = videos;
    wrap.innerHTML = `
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">📥 ${videos.length} مقاطع جاهزة للتحميل — أعطها للمصمم يدمجها</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${videos.map((v,i) => `
          <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">
            <video src="${v.url}" muted autoplay loop playsinline style="width:100%;height:120px;object-fit:cover;"></video>
            <div style="padding:6px 8px;display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:10px;color:var(--muted);">مقطع ${i+1}</span>
              <a href="${v.url}" download="RT_${currentPost.id}_clip${i+1}.mp4" style="font-size:11px;background:var(--green);color:white;padding:3px 8px;border-radius:4px;text-decoration:none;">⬇️</a>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch(e) {
    wrap.innerHTML = `<div style="padding:12px;color:#c0392b;font-size:13px;">⚠️ تعذر تحميل المقاطع: ${e.message}</div>`;
  }
}

async function modalSendDescript() {
  if (!currentPost) return;
  const btn = document.getElementById('btnDesc');
  const res = document.getElementById('descResult');

  btn.disabled = true;
  btn.textContent = '⏳ جاري الإرسال...';
  res.className = 'descript-result show';
  res.textContent = 'جاري جلب الفيديو وإرساله لـ Descript...';

  try {
    if (!currentVideoUrl) {
      const video = await fetchPexelsVideo(currentPost.pexels);
      currentVideoUrl = video.url;
    }
    const result = await sendToDescriptAPI(currentVideoUrl, currentPost.topic);
    if (result.url) {
      res.innerHTML = `✅ الفيديو في Descript — <a href="${result.url}" target="_blank">افتح المشروع</a>`;
    } else {
      res.innerHTML = `✅ تم الإرسال — <a href="https://web.descript.com" target="_blank">افتح Descript</a> وشوف المشروع`;
    }
  } catch(e) {
    res.textContent = '⚠️ ' + (e.message || 'حدث خطأ');
  }

  btn.disabled = false;
  btn.textContent = '⬇️ تحميل الكل';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  currentPost = null;
  currentVideoUrl = null;
}

// ── HELPERS ───────────────────────────────────────────
function toggleDone(id) {
  done = done.includes(id) ? done.filter(x => x !== id) : [...done, id];
  localStorage.setItem('rt_done', JSON.stringify(done));
  renderSchedule();
}

function updateStats() {
  document.getElementById('sDone').textContent = done.length;
  document.getElementById('sLeft').textContent = posts.length - done.length;
}

function cp(id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
    event.target.textContent = 'تم ✓';
    setTimeout(() => event.target.textContent = 'نسخ', 1500);
  });
}

function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// ── INIT ──────────────────────────────────────────────
renderSchedule();
document.getElementById('ideasEl').innerHTML = ideas.map(i =>
  `<div class="idea-card"><div class="idea-icon">${i.icon}</div><div class="idea-title">${i.title}</div><div class="idea-desc">${i.desc}</div></div>`
).join('');
</script>
